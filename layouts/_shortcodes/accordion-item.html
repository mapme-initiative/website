<details class="accordion__item"{{ if .Get "open" }} open{{ end }}>
<summary><span class="accordion__title">{{ .Get "title" }}</span>{{ with .Get "subtitle" }}<span class="accordion__subtitle">{{ . }}</span>{{ end }}</summary>
<div class="accordion__content">
{{ partial "inner.html" (dict "inner" .Inner "page" .Page) }}
</div>
</details>
