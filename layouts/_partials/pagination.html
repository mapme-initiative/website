{{- if gt .TotalPages 1 }}
<nav class="pagination" aria-label="Pagination">
  {{ if .HasPrev }}<a class="pagination__step" href="{{ .Prev.URL }}" rel="prev">← Newer</a>{{ end }}
  {{ $cur := .PageNumber }}
  {{ range .Pagers }}<a href="{{ .URL }}"{{ if eq .PageNumber $cur }} aria-current="page"{{ end }}>{{ .PageNumber }}</a>{{ end }}
  {{ if .HasNext }}<a class="pagination__step" href="{{ .Next.URL }}" rel="next">Older →</a>{{ end }}
</nav>
{{- end }}
